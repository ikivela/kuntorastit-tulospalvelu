[package]
name = "maanantairastit-reader-poc"
version = "0.1.0"
description = "EMIT 250 reader proof of concept"
edition = "2021"

[lib]
name = "maanantairastit_reader_poc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serialport = "4"
