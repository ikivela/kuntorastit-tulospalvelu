services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maanantairastit
      POSTGRES_USER: maanantairastit
      POSTGRES_PASSWORD: maanantairastit
    ports:
      - "5432:5432"
    volumes:
      - maanantairastit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maanantairastit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://maanantairastit:maanantairastit@postgres:5432/maanantairastit
      PORT: 3001
      READER_API_KEY: ${READER_API_KEY:-maanantairastit-reader-dev-key}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  maanantairastit-postgres:
