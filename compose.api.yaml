services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kuntorastit}
      POSTGRES_USER: ${POSTGRES_USER:-kuntorastit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kuntorastit}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kuntorastit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kuntorastit}:${POSTGRES_PASSWORD:-kuntorastit}@postgres:5432/${POSTGRES_DB:-kuntorastit}
      PORT: ${PORT:-3001}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET:-kuntorastit-local-development-secret}
      # Development stack: allows the development token secret and the
      # default admin password (both refused when NODE_ENV=production).
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
