name: Client build

# Run workflow on master updates the rolling "pc-client-latest" prerelease;
# pushing a tag pc-client-vX.Y.Z (matching tauri.conf.json) publishes that
# version as a release. Installers are attached to the release.
on:
  workflow_dispatch: {}
  push:
    tags:
      - "pc-client-v*"

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: clients/pc-client

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libudev-dev

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/pc-client-v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME#pc-client-v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/pc-client/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/pc-client/src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Default API address baked into the client (changeable in the app):
      # set the repository variable VITE_API_BASE_URL, e.g.
      # https://tulokset.example.fi/kuntorastit/api/v1
      - name: Build Tauri app
        run: npm run tauri:build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pc-client-${{ matrix.name }}
          path: clients/pc-client/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/pc-client-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s globstar nullglob
          files=(artifacts/**/*.exe artifacts/**/*.msi artifacts/**/*.deb artifacts/**/*.rpm artifacts/**/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then echo "No installers found" >&2; exit 1; fi
          printf '%s\n' "${files[@]}"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            else
              gh release create "$GITHUB_REF_NAME" "${files[@]}" \
                --title "PC client ${GITHUB_REF_NAME#pc-client-v}" --generate-notes
            fi
          else
            # Rolling build of master: recreate so the tag points at this commit.
            gh release delete pc-client-latest --cleanup-tag --yes 2>/dev/null || true
            gh release create pc-client-latest "${files[@]}" \
              --target "$GITHUB_SHA" --prerelease \
              --title "PC client (uusin master-build)" \
              --notes "Automaattinen build commitista ${GITHUB_SHA::7}. Windows: .exe (asennusohjelma) tai .msi; Linux: .AppImage, .deb tai .rpm."
          fi
